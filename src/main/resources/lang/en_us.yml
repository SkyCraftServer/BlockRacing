# BlockRacing language files
# This file stores all language characters in the game except block names.
# If you need to translate the block name, please check the tutorial at https://github.com/SkyCraftServer/BlockRacing/blob/3.0/docs/en/TranslationTutorial-en.md
# If you need to translate this file, you can directly copy the file content to ChatGPT and let him help translate it.

# Current language: English

# Scoreboard
# In slot settings, If there are no characters in the quotation marks, the line will not be displayed. If there is only one space in the quotation marks, it means that this line is empty.
# Notice! The total number of characters in each line finally displayed on the scoreboard cannot exceed 30, which is the maximum display range of a line!
# This display range includes color codes and spaces, and the text replaced by placeholders is also included!
# Text beyond the range will not be displayed!
scoreboard:
  game-mode:
    normal: "&aNormal"
    racing: "&3Racing"
    contest: "&6Contest"
    time: "&eTime"
    nether: "&cNether"
    speed: "&9Speed"
  blocks:
    easy: "&aEZ"
    medium: "&eMID"
    hard: "&cHARD"
    dyed: "&dDYED"
    addon: "<gradient:#b7d9af:#8bd9c0:#5fd9d1:#32d9e2:#06d9f3>ADDON</gradient>"
    end: "&eEND"
    nether: "&cNETHER"
  pregame:
    title: "&b&lBlock Racing"
    slot11: "&a&lShift+F to open the menu"
    slot10: "&eIf it doesn't work,"
    slot9: "&epls check the key binds of"
    slot8: "&e&lSneak &e& &e&lSwap offhand"
    slot7: " "
    slot6: "&bCurrent mode: &e%game_mode%"
    slot5: "&bBlock amount: &e%block_amount%"
    slot4: "&bBlocks: "
    slot3: "%blocks%"
    slot2: " "
    slot1: "&e&lEnjoy the game!"
  ingame:
    title: "&b&lBlock Racing"
    red-score: "&cRed：&e%score% Points  &b(%current_block%/%total_block%)"
    blue-score: "&9Blue：&e%score% Points  &b(%current_block%/%total_block%)"
    block-format: "%difficulty% | %block%"
    dividing-line: "----------------"
    bottom-slot: "&e&lEnjoy the game!"
    time-left: "&eTime Left: &f%time%"
    overtime: "&cOvertime"
    block-difficulty:
      easy: "&aEASY"
      medium: "&eMID  "
      hard: "&cHARD"
      dyed: "&dDYED"
      addon: "<gradient:#b7d9af:#8bd9c0:#5fd9d1:#32d9e2:#06d9f3>ADDON</gradient>"
      end: "&eEND  "
      nether: "&cNETHER"

# Server list MOTD
motd:
  pregame: "<gradient:#1cfadf:#14f3ea:#0bebf4:#03e4ff><b>BlockRacing</b></gradient> <gray>|</gray> <aqua>Waiting for players</aqua>\n<yellow>Mode:</yellow><white>%mode%</white>"
  ingame: "<gradient:#ff8a00:#ff3434><b>BlockRacing</b></gradient> <gray>|</gray> <red>Game in progress</red>\n<yellow>Red</yellow><white>%red_score%</white><gray> / </gray><yellow>Blue</yellow><white>%blue_score%</white>%time_part%"
  end: "<gradient:#1cfadf:#03e4ff><b>BlockRacing</b></gradient> <gray>|</gray> <gold>Round finished</gold>\n<aqua>Join the next match soon</aqua>"

# Team
team:
  red:
    name: "&RedTeam"
    prefix: "&c[RedTeam]"
    chat: "&c[RedTeam] %s: &f%s"
    color: "&c"
  blue:
    name: "&BlueTeam"
    prefix: "&9[BlueTeam]"
    chat: "&9[BlueTeam] %s: &f%s"
    color: "&9"

