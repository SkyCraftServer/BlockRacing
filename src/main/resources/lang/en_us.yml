      - "&eare completely &lrandom&r&e,"
      - "&eCollecting a block will give 64 blocks"
      - "&eof that block to the opponent's team chest!"
    racing-mode-lore:
      - "&eThe blocks that both teams need to collect"
      - "&eand the order will be completely &lsynchronized&r&e,"
      - "&eand collecting blocks will &lnot&r&e give 64 blocks"
      - "&eof that block to the opposing team!"
    time-mode-lore:
      - "&eWin by completing more tasks before the timer expires,"
      - "&eTies at zero time automatically trigger sudden death overtime!"
      - "&bOnly three target blocks are shown at once and refresh on completion"
    speed-mode-lore:
      - "&aAfter enabling Speed Mode, players will be"
      - "&e&lgiven certain items and effects&e at the start,"
      - "&eand gaining blocks will earn 3 points, "
      - "&espeeding up the game progress."
      - "&bItems: Silk Touch Iron Pickaxe, Cooked Beef, "
      - "&b       Damaged Elytra, Enchanted Book of Mending"
      - "&bEffects: Haste V"
    nether-mode-lore:
      - "&eUse only the Nether block pool (NetherBlocks.txt); other pools are ignored"
      - "&eSpawns and random teleport are limited to the Nether; Nether portals back to Overworld are blocked"
      - "&eCan stack with Normal/Racing/Time and Speed modes; pool toggles are locked while active"
    shared-team-spawn-lore:
      - "&eWhen enabled, both teams spawn at the same location"
      - "&eCreates direct competition right from the start"
      - "&7Disabled by default"
    end-portal-broadcast-lore:
      - "&eWhen enabled, activating an End Portal"
      - "&ewill broadcast its coordinates to the whole server"
      - "&7Disabled by default"
    locked-by-nether: " &7(Locked by Nether Mode)"
    select-team: "&aSelect Team"
    block-setting: "&aBlock Setting"
    select-mode: "&aMode Selection"
    ready-and-start: "&aReady and Start Game"
