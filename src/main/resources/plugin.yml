name: BlockRacing
version: 3.6
main: top.lqsnow.blockracing.Main
api-version: 1.21.11
authors: [ LQ_Snow, xiaojiuwo233, FHSHKL ]
description: The first team to collect the required blocks wins
folia-supported: true
loadbefore:
  - BlockRacingAddon
softdepend:
  - voicechat
depend:
  - PlaceholderAPI
  - SimpleScore
commands:
  tp:
    usage: "/tp <Teammate>"
    description: "TP to teammate."
  locatestructure:
    usage: "/locatestructure <Structure>"
    description: "Locate structure."
  locatebiome:
    usage: "/locatebiome <Biome>"
    description: "Locate biome."
  restartgame:
    usage: "/restartgame"
    description: "Restart the game."
  debug:
    usage: "/debug"
    description: "Debug."
    permission: op
  menu:
    usage: "/menu"
    description: "Open the menu."
  waypoint:
    usage: "/waypoint"
    description: "Run waypoint commands."
  block:
    usage: "/block <team> <number>"
    description: "Query block."
  breload:
    usage: "/breload"
    description: "Reload BlockRacing config and block lists."
    permission: op
  randomteam:
    usage: "/randomteam"
    description: "Randomly assign players to teams."
    permission: op
  forcestart:
    usage: "/forcestart"
    description: "Force start the game and ignore ready status."
    permission: op