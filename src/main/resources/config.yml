# BlockRacing 游戏设置
# 该配置文件仅用于服务器重启后保留设置数据
# 服务器关闭时将自动保存本局游戏的设置到该文件
# 如果服务器已启动，请前往游戏中的设置界面进行设置，不要在这里调整

# 语言
lang: zh_cn

# 除去easy-block以外的四种额外方块库设置
medium-block: false
hard-block: false
dyed-block: false
end-block: false

# 一局游戏需要收集的方块总数
block-amount: 50

# 游戏模式：
# normal  - 普通模式：两个队伍需要收集的方块及顺序完全随机，收集方块会将一组该方块给到对方的队伍箱子里
# racing  - 竞速模式：两个队伍需要收集的方块及顺序将完全相同，且收集方块将不会给予一组方块到对方队伍箱子里
# contest - 争夺模式：双方共享同一方块库，先完成者得分且立即刷新，下一个目标继续争夺
# time    - 计时模式：以限定时长统计队伍完成的任务数量，倒计时结束后积分高者获胜，若平局则进入加时赛
game-mode: normal

# 计时模式配置
# 持续时间单位：分钟，默认 90 分钟
time-mode:
  duration: 90

# 极速模式：
# 开启极速模式后，开局时将会给予玩家部分道具和效果，以加快游戏进度
# 物品：精准采集铁镐、熟牛排、损坏的鞘翅、经验修补附魔书
# 效果：急迫V
speed-mode: false

# 落后补偿：当一队落后达到阈值分数时，为落后队伍持续提供速度III与抗性III
# 分差缩小到阈值内后移除；玩家复活后会重新给予补偿效果
# 设为 0 可关闭该机制
comeback-buff-threshold: 20

# 下界模式：
# 开启后仅使用 NetherBlocks.txt 方块库，并将出生与随机传送限定在下界（阻止通过下界门返回主世界）
# 可与普通/竞速/争夺/计时模式及极速模式叠加
nether-mode: false

# 团队箱子个数
# 默认：8
# 最大：53
max-team-chest-num: 8

# 路径点个数
# 默认：8
# 最大：53
max-team-waypoint-num: 8

# 世界重新生成设置
# 警告：开启后，每次插件启动时将删除并重新生成主世界、下界和末地！
regenerate-worlds-on-startup: false

# 如果你不知道这是什么，不要动它
config-version: 3.6